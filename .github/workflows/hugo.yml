name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.168.0
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          hugo_archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          hugo_asset_id="$(
            curl -sfL --retry 5 --retry-all-errors --retry-delay 3 "https://api.github.com/repos/gohugoio/hugo/releases/tags/v${HUGO_VERSION}" |
              python3 -c 'import json, sys; release=json.load(sys.stdin); name=sys.argv[1]; print(next(asset["id"] for asset in release["assets"] if asset["name"] == name))' "${hugo_archive}"
          )"
          curl -sfL --retry 5 --retry-all-errors --retry-delay 3 -H "Accept: application/octet-stream" -o "${RUNNER_TEMP}/${hugo_archive}" "https://api.github.com/repos/gohugoio/hugo/releases/assets/${hugo_asset_id}"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${RUNNER_TEMP}/${hugo_archive}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: >-
          hugo build
          --gc
          --minify
          --baseURL "${{ steps.pages.outputs.base_url }}/"
          --cacheDir "${RUNNER_TEMP}/.cache/hugo"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
