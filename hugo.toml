baseURL = 'https://thuhan01.github.io/'
languageCode = 'vi'
title = 'Karma Blog'
theme = 'hugo-theme-reimu'

defaultContentLanguage = 'vi'
[languages]
[languages.vi]
  languageName = 'Tiếng Việt'
  weight = 1

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[markup.highlight]
guessSyntax = true
noClasses = false

home = ["HTML", "RSS"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'
